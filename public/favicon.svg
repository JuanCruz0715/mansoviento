<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fondo oscuro con borde redondeado -->
  <rect width="64" height="64" rx="14" fill="#0a0f1f"/>
  <rect width="64" height="64" rx="14" fill="url(#gradient)"/>
  
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="windGradient" x1="10" y1="0" x2="54" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Silueta de montaña (precordillera) -->
  <path 
    d="M4 52 L16 34 L24 42 L34 26 L44 38 L52 30 L60 40 L60 60 L4 60 Z" 
    fill="#1e293b"
    opacity="0.9"
  />
  
  <!-- Nieve en la cima -->
  <path 
    d="M32 26 L34 26 L36 30 L32 32 L28 30 Z" 
    fill="#e2e8f0"
    opacity="0.85"
  />
  
  <!-- Líneas de viento -->
  <path 
    d="M8 22 Q20 18 32 22 T56 22" 
    stroke="url(#windGradient)" 
    stroke-width="2.5" 
    stroke-linecap="round" 
    fill="none"
  />
  <path 
    d="M12 16 Q24 12 36 16 T56 14" 
    stroke="url(#windGradient)" 
    stroke-width="2" 
    stroke-linecap="round" 
    fill="none"
    opacity="0.7"
  />
  <path 
    d="M16 10 Q26 7 36 10 T54 8" 
    stroke="url(#windGradient)" 
    stroke-width="1.5" 
    stroke-linecap="round" 
    fill="none"
    opacity="0.4"
  />
</svg>